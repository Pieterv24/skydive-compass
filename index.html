<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Put your description here.">
  <base href="">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #ededed;
    }

    html[theme="dark"],
    html[theme="dark"] body {
      background-color: #121212;
      color: #ffffff;
    }
  </style>
  <script>
    const userPrefersDark = window.matchMedia(
      '(prefers-color-scheme: dark)',
    ).matches;
    const darkTheme =
      localStorage.getItem('theme-dark') ||
      (userPrefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('theme', darkTheme);
  </script>

  <script type="module">
    import "@webcomponents/scoped-custom-element-registry";
  </script>
  <title>skydive-compass</title>
</head>

<body>
  <skydive-compass></skydive-compass>

  <script type="module" src="./__element-definitions/skydive-compass.js"></script>
</body>

</html>
